# Kafka KRaft de um único nó — SOMENTE PARA DESENVOLVIMENTO.
#
# Reproduz de propósito a configuração do TP1 que pode quebrar o TP2:
#   - num.partitions=3
#   - auto.create.topics.enable=false
# A replicação é RF=1 apenas em dev; na AWS o TP2 usa RF=3.
#
# Uso:
#   docker compose -f tp2/docker/docker-compose.dev.yml up -d
#   docker compose -f tp2/docker/docker-compose.dev.yml down
#
# O estado é efêmero (sem volume): cada "down" reinicia o cluster do zero.

services:
  kafka:
    image: apache/kafka:3.7.2
    container_name: tp2-kafka-dev
    hostname: kafka-dev
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      # Armadilha do TP1 reproduzida em dev:
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s
    restart: unless-stopped
