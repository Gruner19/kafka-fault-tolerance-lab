# Carga desigual: c1 pede mais e quase sem pausa; os demais seguem o comum.
name: uneven-load
num_nodes: 5
num_clients: 5
requests_per_client: [10, 15]
cs_duration: [0.2, 1.0]
think_time: [1.0, 3.0]
seed: 5303
sync_enabled: true
repetitions: 3
capacity: 1
replication_factor: 1
min_insync_replicas: 1
retention_ms: 86400000
expect_violation: false
clients:
  - client_id: c1
    requests: 40
    think_time: [0.0, 0.2]
    node_index: 1
