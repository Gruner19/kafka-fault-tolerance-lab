# Extensão opcional: semáforo distribuído com K=2 sobre o mesmo log.
# Não substitui o mutex sobre R; é uma etapa separada.
name: extension-semaphore
num_nodes: 5
num_clients: 5
requests_per_client: [10, 15]
cs_duration: [0.2, 1.0]
think_time: [0.0, 0.0]
seed: 7505
sync_enabled: true
repetitions: 2
capacity: 2
replication_factor: 1
min_insync_replicas: 1
retention_ms: 86400000
expect_violation: false
