# ---------------------------------------------------------------------------
# FASE 0: Instalación (para VMs que ya existen y no ejecutaron cloud-init)
# ---------------------------------------------------------------------------
- name: Instalar OpenJDK 17
  become: true
  ansible.builtin.apt:
    name: openjdk-17-jdk
    state: present
    update_cache: true

- name: Crear usuario de sistema kafka
  become: true
  ansible.builtin.user:
    name: kafka
    system: true
    shell: /bin/bash
    create_home: true

- name: Crear directorio de datos
  become: true
  ansible.builtin.file:
    path: "{{ broker_data_dir }}"
    state: directory
    owner: kafka
    group: kafka
    mode: "0755"

- name: Comprobar si Kafka ya está instalado
  become: true
  ansible.builtin.stat:
    path: "{{ kafka_install_dir }}/bin/kafka-server-start.sh"
  register: kafka_binary

- name: Descargar Kafka {{ kafka_version }} (si no está instalado)
  become: true
  ansible.builtin.unarchive:
    src: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ kafka_dist }}-{{ kafka_version }}.tgz"
    dest: /opt
    remote_src: true
    owner: kafka
    group: kafka
  when: not kafka_binary.stat.exists

- name: Crear enlace simbólico /opt/kafka
  become: true
  ansible.builtin.file:
    src: "/opt/kafka_{{ kafka_dist }}-{{ kafka_version }}"
    dest: /opt/kafka
    state: link
    force: true

- name: Asegurar permisos sobre la instalación
  become: true
  ansible.builtin.file:
    path: "{{ kafka_install_dir }}"
    state: directory
    owner: kafka
    group: kafka
    recurse: true

- name: Escribir /etc/hosts con todos los brokers
  become: true
  ansible.builtin.copy:
    dest: /etc/hosts
    content: |
      127.0.0.1 localhost
      {% for host in groups['brokers'] %}
      {{ hostvars[host]['broker_ip'] | default(hostvars[host]['ansible_host']) }}  {{ host }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"

- name: Descargar JMX Prometheus agent
  become: true
  ansible.builtin.get_url:
    url: https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/1.0.1/jmx_prometheus_javaagent-1.0.1.jar
    dest: "{{ kafka_install_dir }}/jmx_prometheus_javaagent.jar"
    owner: kafka
    group: kafka
    mode: "0644"

- name: Desplegar kafka-jmx-config.yml
  become: true
  ansible.builtin.copy:
    src: kafka-jmx-config.yml
    dest: "{{ kafka_install_dir }}/kafka-jmx-config.yml"
    owner: kafka
    group: kafka
    mode: "0644"

- name: Generar server.properties para el nodo {{ node_id }}
  become: true
  ansible.builtin.template:
    src: server.properties.j2
    dest: "{{ kafka_install_dir }}/config/kraft/server-node{{ node_id }}.properties"
    owner: kafka
    group: kafka
    mode: "0644"

- name: Comprobar si el almacenamiento ya está formateado
  become: true
  ansible.builtin.stat:
    path: "{{ broker_data_dir }}/meta"
  register: kafka_meta

- name: Formatear almacenamiento (solo una vez)
  become: true
  ansible.builtin.command:
    cmd: >
      {{ kafka_install_dir }}/bin/kafka-storage.sh format
      -t {{ kafka_cluster_id }}
      -c {{ kafka_install_dir }}/config/kraft/server-node{{ node_id }}.properties
      --ignore-formatted
  register: kafka_format
  changed_when: "'Formatting' in kafka_format.stdout"
  # Idempotente: no reformatear si ya está inicializado
  when: not kafka_meta.stat.exists

- name: Asegurar propietario del directorio de datos
  become: true
  ansible.builtin.file:
    path: "{{ broker_data_dir }}"
    state: directory
    owner: kafka
    group: kafka
    recurse: true

- name: Instalar unit systemd de Kafka
  become: true
  ansible.builtin.template:
    src: kafka.service.j2
    dest: /etc/systemd/system/kafka.service
    owner: root
    group: root
    mode: "0644"

- name: Recargar systemd y habilitar Kafka
  become: true
  ansible.builtin.systemd:
    name: kafka
    enabled: true
    daemon_reload: true
    state: started