name: rebalance
topic: orders
bootstrap: localhost:9092
prometheus_url: http://localhost:9090
producer_rate: 30
baseline_seconds: 45
recovery_seconds: 60
consumer_group: order-processor-group
ssh_key: /home/gruner-sanchez/Descargas/SSH/kafka-cluster-key.pem
ssh_user: ubuntu

brokers:
  - { host: 18.225.31.122, node_id: 1 }
  - { host: 3.22.234.84, node_id: 2 }
  - { host: 18.222.141.214, node_id: 3 }

# Rebalanceo: cada evento lanza un consumidor extra durante 15 segundos.
# La carga de 30 msg/s hace visible el efecto sobre lag y throughput.
faults:
  - kind: rebalance
    at: 45.0
    duration: 15.0
  - kind: rebalance
    at: 75.0
    duration: 15.0
  - kind: rebalance
    at: 105.0
    duration: 15.0
  - kind: rebalance
    at: 135.0
    duration: 15.0